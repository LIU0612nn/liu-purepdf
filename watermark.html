    <meta charset="UTF-8"><title>PDF加水印 - PurePDF在线PDF工具</title>
<meta name="description" content="PDF在线加水印工具，本地浏览器给PDF添加文字水印，文件不上传服务器，简单安全。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF添加水印 - PurePDF</title>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto,sans-serif;}
        header{background:#2b57d8;color:#fff;padding:16px 20px;}
        .header-wrap{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
        .logo{font-size:20px;font-weight:bold;}
        header a{color:#fff;text-decoration:none;margin:0 8px;}
        .container{max-width:800px;margin:40px auto;padding:0 20px;}
        h1{text-align:center;margin-bottom:30px;font-size:26px;}
        .drop-area{border:2px dashed #999;border-radius:12px;padding:40px 20px;text-align:center;margin-bottom:20px;transition:0.2s;}
        .drop-area.active{border-color:#2b57d8;background:#f0f4ff;}
        input[type="file"]{display:none;}
        .btn{background:#2b57d8;color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer;margin:6px;}
        .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .file-item{padding:8px 12px;background:#f3f4f6;border-radius:6px;margin:6px 0;}
        .tip{color:#555;margin:10px 0;}
        .input-wrap{margin:15px 0;text-align:center;}
        footer{background:#222938;color:#ccc;text-align:center;padding:24px;margin-top:60px;font-size:14px;}

<header>
    <div class="header-wrap">
        <div class="logo"><a href="index.html">PurePDF</a></div>
        <nav>
            <a href="index.html">首页</a>

            <a href="compress.html">压缩</a>
            <a href="watermark.html">水印</a>
        </nav>
    </div>
</header>
<div class="container">
    <h1>PDF添加文字水印</h1>
    <div class="drop-area" id="dropZone">
        <p class="tip">拖拽PDF到此，或者选择PDF文件</p>
        <button class="btn" id="selectBtn">选择PDF文件</button>
        <input type="file" id="fileInput" accept=".pdf">
    </div>
    <div id="fileShow"></div>
    <div class="input-wrap">
        <label>水印文字：</label>
        <input type="text" id="waterText" value="PurePDF" style="padding:8px;width:240px;font-size:16px;">
    </div>
    <div style="text-align:center;">
        <button class="btn" id="wmBtn">添加水印并下载</button>
    </div>
</div>
<script>
const { PDFDocument, rgb, degrees } = PDFLib;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectBtn = document.getElementById('selectBtn');
const fileShow = document.getElementById('fileShow');
const waterText = document.getElementById('waterText');
const wmBtn = document.getElementById('wmBtn');

let pdfFile = null;

selectBtn.onclick = ()=> fileInput.click();
fileInput.onchange = e=>{
    if(e.target.files[0]){
        pdfFile = e.target.files[0];
        fileShow.innerHTML = `<div class="file-item">${pdfFile.name}</div>`;
    }
};

dropZone.ondragover = e=>{e.preventDefault();dropZone.classList.add('active');};
dropZone.ondragleave = ()=> dropZone.classList.remove('active');
dropZone.ondrop = e=>{
    e.preventDefault();
    dropZone.classList.remove('active');
    if(e.dataTransfer.files[0]){
        pdfFile = e.dataTransfer.files[0];
        fileShow.innerHTML = `<div class="file-item">${pdfFile.name}</div>`;
    }
};

wmBtn.onclick = async ()=>{
    if(!pdfFile){alert("请选择PDF");return;}
    const wtext = waterText.value.trim();
    if(!wtext){alert("请填写水印文字");return;}
    wmBtn.disabled=true;
    try{
        const buf = await pdfFile.arrayBuffer();
        const pdfDoc = await PDFDocument.load(buf);
        const helveticaFont = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        const pages = pdfDoc.getPages();
        for(let page of pages){
            const { width, height } = page.getSize();
            page.drawText(wtext, {
                x: width*0.25,
                y: height*0.45,
                size:40,
                font:helveticaFont,
                color:rgb(0.75,0.75,0.75),
                opacity:0.3,
                rotate:degrees(-45)
            });
        }
        const bytes = await pdfDoc.save();
        download(bytes, "watermarked.pdf","application/pdf");
    }catch(err){
        alert("添加水印失败："+err.message);
        console.error(err);
    }
    wmBtn.disabled=false;
};

function download(bytes, filename, mime){
    const blob = new Blob([bytes], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}
</script>
