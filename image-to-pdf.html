<div class="container">
    <h1>图片转PDF</h1>
    <div class="drop-area" id="dropZone">
        <p class="tip">拖拽多张图片到此，或者选择图片（jpg/png）</p>
        <button class="btn" id="selectBtn">选择图片</button>
        <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div class="file-list" id="fileList"></div>
    <div style="text-align:center;">
        <button class="btn" id="buildBtn">生成PDF并下载</button>
    </div>
</div>
<footer>PurePDF ©2026｜全部处理在浏览器本地，文件不上传服务器</footer>

<script>
const { PDFDocument } = PDFLib;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectBtn = document.getElementById('selectBtn');
const fileList = document.getElementById('fileList');
const buildBtn = document.getElementById('buildBtn');

let imgFiles = [];

selectBtn.onclick = ()=> fileInput.click();
fileInput.onchange = e=> handleImages(e.target.files);

dropZone.ondragover = e=>{e.preventDefault();dropZone.classList.add('active');};
dropZone.ondragleave = ()=> dropZone.classList.remove('active');
dropZone.ondrop = e=>{
    e.preventDefault();
    dropZone.classList.remove('active');
    handleImages(e.dataTransfer.files);
};

function handleImages(files){
    for(let f of files){
        if(f.type.startsWith('image/')) imgFiles.push(f);
    }
    renderList();
}
function renderList(){
    fileList.innerHTML='';
    imgFiles.forEach((f,i)=>{
        const div = document.createElement('div');
        div.className='file-item';
        div.innerText = `${i+1}. ${f.name}`;
        fileList.appendChild(div);
    });
}

buildBtn.onclick = async ()=>{
    if(imgFiles.length===0){alert("请选择至少一张图片");return;}
    buildBtn.disabled=true;
    try{
        const pdfDoc = await PDFDocument.create();
        for(let f of imgFiles){
            const buf = await f.arrayBuffer();
            let embed;
            if(f.type==='image/jpeg'){
                embed = await pdfDoc.embedJpg(buf);
            }else{
                embed = await pdfDoc.embedPng(buf);
            }
            const page = pdfDoc.addPage([embed.width, embed.height]);
            page.drawImage(embed,{x:0,y:0,width:embed.width,height:embed.height});
        }
        const bytes = await pdfDoc.save();
        download(bytes, "images.pdf","application/pdf");
    }catch(err){
        alert("生成PDF失败："+err.message);
        console.error(err);
    }
    buildBtn.disabled=false;
};

function download(bytes, filename, mime){
    const blob = new Blob([bytes], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}
</script>
