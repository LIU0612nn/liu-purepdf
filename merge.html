<div class="container">
    <h1>PDF合并</h1>
    <div class="drop-area" id="dropZone">
        <p class="tip">拖拽PDF文件到此处，或者点击下方按钮选择文件（至少2个PDF）</p>
        <button class="btn" id="selectBtn">选择PDF文件</button>
        <input type="file" id="fileInput" accept=".pdf" multiple>
    </div>
    <div class="file-list" id="fileList"></div>
    <div style="text-align:center;">
        <button class="btn" id="mergeBtn">开始合并并下载</button>
    </div>
</div>
<script>
const { PDFDocument } = PDFLib;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectBtn = document.getElementById('selectBtn');
const fileList = document.getElementById('fileList');
const mergeBtn = document.getElementById('mergeBtn');

let files = [];

selectBtn.onclick = ()=> fileInput.click();

fileInput.onchange = e=> handleFiles(e.target.files);

//拖拽
dropZone.ondragover = e=>{e.preventDefault();dropZone.classList.add('active');};
dropZone.ondragleave = ()=> dropZone.classList.remove('active');
dropZone.ondrop = e=>{
    e.preventDefault();
    dropZone.classList.remove('active');
    handleFiles(e.dataTransfer.files);
};

function handleFiles(fileArr){
    for(let f of fileArr){
        if(f.type !== 'application/pdf') continue;
        files.push(f);
    }
    renderFileList();
}

function renderFileList(){
    fileList.innerHTML = '';
    files.forEach((f,i)=>{
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerText = `${i+1}. ${f.name}`;
        fileList.appendChild(div);
    });
}

mergeBtn.onclick = async ()=>{
    if(files.length <2){
        alert("请至少选择2个PDF文件");
        return;
    }
    mergeBtn.disabled = true;
    try{
        const newPdf = await PDFDocument.create();
        for(let f of files){
            const buf = await f.arrayBuffer();
            const srcPdf = await PDFDocument.load(buf);
            const pages = await newPdf.copyPages(srcPdf, srcPdf.getPageIndices());
            pages.forEach(p=> newPdf.addPage(p));
        }
        const pdfBytes = await newPdf.save();
        download(pdfBytes, "merged.pdf", "application/pdf");
    }catch(err){
        console.error(err);
        alert("合并失败："+err.message);
    }
    mergeBtn.disabled = false;
};

function download(bytes, filename, mime){
    const blob = new Blob([bytes], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}</script>
