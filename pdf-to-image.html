    <meta charset="UTF-8"><title>PDF转图片 - PurePDF在线PDF工具</title>
<meta name="description" content="PDF转高清图片工具，浏览器本地将PDF页面导出为JPG、PNG图片，文件不会上传服务器。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF转图片 - PurePDF</title>
    <meta name="description" content="PDF页面导出为图片，浏览器本地转换。">
    <link rel="canonical" href="https://purepdf.cn/pdf-to-image.html">
    <script src="https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto,sans-serif;}
        header{background:#2b57d8;color:#fff;padding:16px 20px;}
        .header-wrap{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
        .logo{font-size:20px;font-weight:bold;}
        header a{color:#fff;text-decoration:none;margin:0 8px;}
        .container{max-width:800px;margin:40px auto;padding:0 20px;}
        h1{text-align:center;margin-bottom:30px;font-size:26px;}
        .drop-area{border:2px dashed #999;border-radius:12px;padding:50px 20px;text-align:center;margin-bottom:20px;transition:0.2s;}
        .drop-area.active{border-color:#2b57d8;background:#f0f4ff;}
        input[type="file"]{display:none;}
        .btn{background:#2b57d8;color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer;margin:6px;}
        .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .file-item{padding:8px 12px;background:#f3f4f6;border-radius:6px;margin:6px 0;}
        .tip{color:#555;margin:10px 0;}
        footer{background:#222938;color:#ccc;text-align:center;padding:24px;margin-top:60px;font-size:14px;}
    </style>
</head>
<body>
<header>
    <div class="header-wrap">
        <div class="logo"><a href="index.html">PurePDF</a></div>
        <nav>
            <a href="index.html">首页</a>
            <a href="merge.html">合并</a>
            <a href="split.html">拆分</a>
            <a href="compress.html">压缩</a>
            <a href="watermark.html">水印</a>
            <a href="pdf-to-image.html">PDF转图片</a>
        </nav>
    </div>
</header>
<div class="container">
    <h1>PDF转图片</h1>
    <div class="drop-area" id="dropZone">
        <p class="tip">拖拽PDF到此，选择PDF，每一页导出PNG图片</p>
        <button class="btn" id="selectBtn">选择PDF文件</button>
        <input type="file" id="fileInput" accept=".pdf">
    </div>
    <div id="fileShow"></div>
    <div style="text-align:center;">
        <button class="btn" id="convertBtn">转换并下载图片</button>
    </div>
</div>
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectBtn = document.getElementById('selectBtn');
const fileShow = document.getElementById('fileShow');
const convertBtn = document.getElementById('convertBtn');
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.worker.min.js";

let pdfFile = null;

selectBtn.onclick = ()=> fileInput.click();
fileInput.onchange = e=>{
    if(e.target.files[0]){
        pdfFile = e.target.files[0];
        fileShow.innerHTML = `<div class="file-item">${pdfFile.name}</div>`;
    }
};

dropZone.ondragover = e=>{e.preventDefault();dropZone.classList.add('active');};
dropZone.ondragleave = ()=> dropZone.classList.remove('active');
dropZone.ondrop = e=>{
    e.preventDefault();
    dropZone.classList.remove('active');
    if(e.dataTransfer.files[0]){
        pdfFile = e.dataTransfer.files[0];
        fileShow.innerHTML = `<div class="file-item">${pdfFile.name}</div>`;
    }
};

convertBtn.onclick = async ()=>{
    if(!pdfFile){alert("请选择PDF");return;}
    convertBtn.disabled=true;
    try{
        const buf = await pdfFile.arrayBuffer();
        const pdfDoc = await pdfjsLib.getDocument(buf).promise;
        const total = pdfDoc.numPages;
        for(let i=1;i<=total;i++){
            const page = await pdfDoc.getPage(i);
            const scale =1.5;
            const viewport = page.getViewport({scale});
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({canvasContext:ctx, viewport:viewport}).promise;
            const dataUrl = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `page_${i}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    }catch(err){
        alert("转换失败："+err.message);
        console.error(err);
    }
    convertBtn.disabled=false;
};
</script>
